name: publish

# Publish @xia-sc/dsh-decision to npm.
#
# Trigger: push a `v*` tag whose name matches package.json's version, or run the
# workflow manually from the Actions tab and type the version you are confirming.
#
# Authentication: npm Trusted Publishing (OIDC) — configured on npmjs.com for
# this package (Settings → Trusted publishing → GitHub, repository
# `xia-sc/dsh-decision`, workflow `publish.yml`). No repository secret is needed;
# `id-token: write` below lets npm exchange the GitHub OIDC token for a
# short-lived publish credential and attach a provenance attestation.
#
# There is deliberately no token/secret path: README §10.5 documents this one.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version you are publishing; must equal package.json "version"'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm >= 11.5; `latest` satisfies that today and
      # keeps the run on the registry's current client.
      - name: Upgrade npm
        run: npm install -g npm@latest && npm --version

      - name: Preflight (files, manifest, no secrets, no machine paths)
        run: node scripts/preflight.mjs

      - name: Version must match the tag (push) or the manual confirmation (dispatch)
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$pkg_version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg_version"
              exit 1
            fi
          else
            if [ "$DISPATCH_VERSION" != "$pkg_version" ]; then
              echo "::error::typed version '$DISPATCH_VERSION' does not match package.json version $pkg_version"
              exit 1
            fi
            echo "::notice::manual dispatch confirmed for version $pkg_version"
          fi

      - name: Skip when this version is already published
        id: published
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "@xia-sc/dsh-decision@$version" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@xia-sc/dsh-decision@$version is already on npm; nothing to publish."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm (Trusted Publishing / OIDC)
        if: steps.published.outputs.skip != 'true'
        run: npm publish --access public --provenance
