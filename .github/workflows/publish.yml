name: publish

# Publish @xia-sc/dsh-decision to npm.
#
# Two supported credential paths, in priority order:
#   A) repository secret NPM_TOKEN — a granular npm token with "publish" on the
#      @xia-sc scope. Simplest, works before the package exists on npm.
#   B) npm Trusted Publishing (OIDC, no token) — configure it once on npmjs.com:
#      package → Settings → Trusted publishing → GitHub, repository
#      `xia-sc/dsh-decision`, workflow file `publish.yml`. Requires npm >= 11.5
#      (the step below upgrades it) and this repository to be public.
#
# Trigger: push a `v*` tag that matches package.json's version, or run the
# workflow manually from the Actions tab.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm (trusted publishing needs >= 11.5)
        run: npm install -g npm@latest && npm --version

      - name: Preflight (files, package name, no secrets)
        run: node scripts/preflight.mjs

      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg_version"
            exit 1
          fi

      - name: Publish with NPM_TOKEN
        if: ${{ secrets.NPM_TOKEN != '' }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish with Trusted Publishing (OIDC)
        if: ${{ secrets.NPM_TOKEN == '' }}
        run: npm publish --access public --provenance
