name: publish

# Publish @xia-sc/dsh-decision to npm.
#
# Trigger: push a `v*` tag whose name matches package.json's version, or run the
# workflow manually from the Actions tab.
#
# Authentication: add the repository secret NPM_TOKEN (npm token with publish on
# the @xia-sc scope — classic "Automation" token, or a granular token with
# "Bypass 2FA" ticked). To switch to npm Trusted Publishing instead, delete the
# NODE_AUTH_TOKEN line below and configure the trusted publisher on npmjs.com
# (package → Settings → Trusted publishing → GitHub, repository
# `xia-sc/dsh-decision`, workflow `publish.yml`).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm
        run: npm install -g npm@latest && npm --version

      - name: Preflight (files, package name, no secrets)
        run: node scripts/preflight.mjs

      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg_version"
            exit 1
          fi

      - name: Skip when this version is already published
        id: published
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "@xia-sc/dsh-decision@$version" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@xia-sc/dsh-decision@$version is already on npm; nothing to publish."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.published.outputs.skip != 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
